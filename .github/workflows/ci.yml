
name: Salesforce JWT Connection Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  connect:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Salesforce CLI
        run: npm install --global @salesforce/cli

      
     
      - name: Prepare and validate JWT private key
        env:
          SF_JWT_KEY_B64: ${{ secrets.SF_JWT_KEY_B64 }}
        shell: bash
        run: |
          if [ -z "$SF_JWT_KEY_B64" ]; then
            echo "::error::JWT key secret is missing"
            exit 1
          fi

          printf '%s' "$SF_JWT_KEY_B64" |
            base64 --decode > "$RUNNER_TEMP/server.key"

          chmod 600 "$RUNNER_TEMP/server.key"

          if ! openssl rsa \
            -in "$RUNNER_TEMP/server.key" \
            -check -noout > /dev/null 2>&1; then
            echo "::error::Invalid RSA private key"
            exit 1
          fi

          echo "RSA private key validation passed"


      - name: Authenticate to Salesforce
        env:
          SF_CLIENT_ID: ${{ secrets.SF_CLIENT_ID }}
          SF_USERNAME: ${{ secrets.SF_USERNAME }}
          SF_INSTANCE_URL: ${{ secrets.SF_INSTANCE_URL }}
        run: |
          sf org login jwt \
            --client-id "$SF_CLIENT_ID" \
            --jwt-key-file "$RUNNER_TEMP/server.key" \
            --username "$SF_USERNAME" \
            --instance-url "$SF_INSTANCE_URL" \
            --alias devorg

      - name: Confirm connection
        run: |
          sf org display --target-org devorg
          echo "Salesforce authentication succeeded"


      - name: Validate Salesforce deployment
        run: |
          sf project deploy start \
            --manifest manifest/package.xml \
            --target-org devorg \
            --dry-run \
            --test-level RunSpecifiedTests \
            --tests RevenueCalculatorTest \
            --tests PricingServiceTest \
            --wait 30

